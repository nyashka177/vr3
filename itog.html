<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>A-Frame Sphere Shooter</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script>
        AFRAME.registerComponent('sphere-spawner', {
            init: function () {
                this.cameraEl = document.querySelector('#camera');
                this.interval = 3000; // 3 секунды
                this.tickCount = 0;
            },

            tick: function (time, deltaTime) {
              this.tickCount += deltaTime;
                if (this.tickCount >= this.interval) {
                  this.tickCount = 0;
                    this.spawnSphere();
                }
            },
          spawnSphere: function () {
              let sphere = document.createElement('a-sphere');
              sphere.setAttribute('radius', 0.1);
              sphere.setAttribute('color', 'red');
                sphere.setAttribute('move-ball', '');

              let cameraPosition = this.cameraEl.object3D.position;
                let cameraRotation = this.cameraEl.object3D.rotation;
              let direction = new THREE.Vector3(0, 0, -1).applyEuler(cameraRotation);

                sphere.setAttribute('position', cameraPosition);
              sphere.setAttribute('velocity', direction.multiplyScalar(0.15));

              this.el.sceneEl.appendChild(sphere);
          }
        });

        AFRAME.registerComponent('move-ball', {
            tick: function (time, deltaTime) {
                let ball = this.el;
                let velocity = ball.getAttribute('velocity');
                let position = ball.getAttribute('position');
                if (!velocity) return;
                let newPosition = {x: position.x + velocity.x * deltaTime, y: position.y + velocity.y * deltaTime, z: position.z + velocity.z * deltaTime};

                ball.setAttribute('position', newPosition);

                if (newPosition.z < -15)
                {
                   ball.remove();
                   return;
                }
           }
        });
    </script>
</head>
<body>
    <a-scene>
        <a-assets>
        <img id="boxTexture" src="https://i.imgur.com/zzCRZUH.jpeg">
        <img id="groundTexture" src="https://i.imgur.com/SohhFGz.png">
        <img id="skyTexture" src="https://i.imgur.com/DK6GZIK.png">
      </a-assets>
        
<a-sky height="2048" radius="30" src="#skyTexture" theta-length="90" width="2048"></a-sky>
      <a-light type="ambient" color="#445451"></a-light>
      <a-light type="point" intensity="2" position="2 4 4"></a-light>
      <a-plane src="#groundTexture" rotation="-90 0 0" height="100" width="100"></a-plane>
        
        <a-camera>
            <a-cursor color="#FAFAFA"></a-cursor>
        </a-camera>
    </a-scene>
</body>
</html>
