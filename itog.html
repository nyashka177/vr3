<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Shooting Game Sponsored By Dottore</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('player-move', {
        tick: function (time, deltaTime) {
            let player = this.el;
            let speed = 0.01; // Скорость движения игрока
            player.object3D.position.z -= speed * deltaTime;
        }
      });

      AFRAME.registerComponent('shoot-ball', {
          init: function() {
            this.cooldown = false;
            this.cooldownTime = 500;
            this.cameraEl = document.querySelector('#camera');
            this.playerEl = document.querySelector('#player');


            this.el.addEventListener('click', () => {
              if (!this.cooldown) {
                this.shoot();
                this.cooldown = true;
                setTimeout(() => {
                  this.cooldown = false;
                }, this.cooldownTime);
              }
            });
          },

        shoot: function() {
            let ball = document.createElement('a-sphere');
            ball.setAttribute('radius', 0.1);
            ball.setAttribute('color', 'red');
            ball.setAttribute('class', 'ball');

            let cameraPosition = this.cameraEl.object3D.position;
            let cameraRotation = this.cameraEl.object3D.rotation;
            let direction = new THREE.Vector3(0, 0, -1).applyEuler(cameraRotation);

            ball.setAttribute('position', cameraPosition);
            ball.setAttribute('velocity', direction.multiplyScalar(0.15));

            this.el.sceneEl.appendChild(ball);
        }
      });

        AFRAME.registerComponent('move-ball', {
            tick: function (time, deltaTime) {
                let ball = this.el;
                let velocity = ball.getAttribute('velocity');
                let position = ball.getAttribute('position');
                if (!velocity) return;
                let newPosition = {x: position.x + velocity.x * deltaTime, y: position.y + velocity.y * deltaTime, z: position.z + velocity.z * deltaTime};

                ball.setAttribute('position', newPosition);

                // Проверка столкновений
                let boxes = document.querySelectorAll('.box');
                for (let box of boxes) {
                    if (ball.isCollideWith(box)) {
                      box.remove();
                      ball.remove();
                      return;
                    }
                }

                // Удаление шарика за пределами видимости
                if (newPosition.z < -15)
                {
                   ball.remove();
                   return;
                }
           }
        });

        AFRAME.registerComponent('collision-check', {
           isCollideWith: function(other)
           {
                let pos1 = this.el.object3D.position;
                let size1 = this.el.getAttribute('geometry');
                if (!size1) return false;
                let scale1 = this.el.object3D.scale;
                let box1 = new THREE.Box3(new THREE.Vector3(pos1.x - size1.width/2 * scale1.x,pos1.y - size1.height/2 * scale1.y, pos1.z - size1.depth/2 * scale1.z), new THREE.Vector3(pos1.x + size1.width/2 * scale1.x,pos1.y + size1.height/2 * scale1.y, pos1.z + size1.depth/2* scale1.z));

                let pos2 = other.object3D.position;
                let size2 = other.getAttribute('geometry');
                if (!size2) return false;
                let scale2 = other.object3D.scale;
                let box2 = new THREE.Box3(new THREE.Vector3(pos2.x - size2.width/2 * scale2.x,pos2.y - size2.height/2 * scale2.y, pos2.z - size2.depth/2 * scale2.z), new THREE.Vector3(pos2.x + size2.width/2 * scale2.x,pos2.y + size2.height/2 * scale2.y, pos2.z + size2.depth/2* scale2.z));

                return box1.intersectsBox(box2);
           }
        });

        AFRAME.registerComponent('create-boxes', {
            init: function() {
                let scene = this.el;
                let numBoxes = 5;
                let boxSpacing = 2;

                for (let i = 0; i < numBoxes; i++) {
                  let box1 = document.createElement('a-box');
                  box1.setAttribute('class', 'box');
                  box1.setAttribute('color', 'lime');
                  box1.setAttribute('width', 1);
                  box1.setAttribute('height', 1);
                  box1.setAttribute('depth', 0.5);
                  box1.setAttribute('position', (-boxSpacing) + ' ' + 0.5 + ' ' + (-5 - i*boxSpacing*2));
                  scene.appendChild(box1);

                  let box2 = document.createElement('a-box');
                  box2.setAttribute('class', 'box');
                  box2.setAttribute('color', 'lime');
                  box2.setAttribute('width', 1);
                  box2.setAttribute('height', 1);
                  box2.setAttribute('depth', 0.5);
                  box2.setAttribute('position', (boxSpacing) + ' ' + 0.5 + ' ' + (-5 - i*boxSpacing*2));
                  scene.appendChild(box2);
                }
             }
          });
    </script>
  </head>
  <body>
    <a-scene create-boxes>
       <a-entity id="player" player-move>
            <a-entity id="camera" camera look-controls wasd-controls shoot-ball>
               <a-entity cursor="fuse: true; fuseTimeout: 500"></a-entity>
            </a-entity>
       </a-entity>
    </a-scene>
  </body>
</html>
